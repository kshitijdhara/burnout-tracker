name: Bug report
description: Something in BurntOut doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't paste your recorded data, window titles or unredacted logs here**: this issue is public.
        Security problems go through [private vulnerability reporting](https://github.com/kshitijdhara/burntout/security/advisories/new), not an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `burntout ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `burntout version`.
      placeholder: 0.1.0-alpha.4
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (GNOME on Wayland)
        - Linux (other Wayland desktop)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and desktop
      placeholder: macOS 15.4 / Windows 11 24H2 / Ubuntu 24.04, GNOME 46
  - type: textarea
    id: doctor
    attributes:
      label: Output of `burntout doctor`
      description: Check it first, and remove anything you'd rather not share.
      render: text
