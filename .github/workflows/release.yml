name: Release

# Builds, signs and publishes a release from a v* tag (ADR-0005).
#
#   build   GoReleaser on macOS (cgo for darwin), cosign keyless signature
#           and SBOMs. No secrets, nothing published.
#   attest  GitHub build-provenance attestations for every asset.
#   sign    In the protected `release` environment: signs checksums.txt
#           with the pinned ECDSA P-256 key, then checks the signature
#           with install.sh's own verifier against the embedded keys.
#   publish Creates the GitHub release once all of the above pass.
#
# Setup by hand, once (packaging/README.md, "Key ceremony"):
#   - an environment named `release` with required reviewers, limited to
#     tags matching v*;
#   - its secret RELEASE_SIGNING_KEY: the PEM private key (current key).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from a clean cache
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Pin timestamps to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only here; nothing is published
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/CHANGELOG.md

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Sign checksums.txt with the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set in the release environment"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          openssl dgst -sha256 -sign "$key" -out dist/checksums.txt.sig dist/checksums.txt
      # Fails if the secret isn't the private half of a key the installers
      # pin (for example while the placeholders are still embedded), so an
      # unverifiable release is never published.
      - name: Verify with the installers' pinned keys
        run: |
          BURNTOUT_INSTALL_LIB=1 . packaging/install.sh
          verify_signature dist/checksums.txt dist/checksums.txt.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          if-no-files-found: error
          path: dist/checksums.txt.sig

  publish:
    needs: [build, attest, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          notes=dist/CHANGELOG.md
          [ -s "$notes" ] || { echo "Release $TAG" >"$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          assets=$(find dist -maxdepth 1 -type f ! -name CHANGELOG.md | sort)
          # shellcheck disable=SC2086 # one asset per word
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" $prerelease $assets
