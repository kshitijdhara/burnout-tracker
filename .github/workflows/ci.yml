name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are referenced by tag for now; Renovate pins them to commit SHAs
# (privacy & security §9.4).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint (linux, windows, darwin without cgo)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...
          GOOS=windows golangci-lint run ./...
          GOOS=darwin CGO_ENABLED=0 golangci-lint run ./...
      - name: go vet (cross)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin CGO_ENABLED=0 go vet ./...
          go vet -tags e2e ./cmd/burnout/
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # The darwin cgo collector only compiles on macOS, so lint and vet it there.
  lint-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint and go vet (darwin, cgo)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
          go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install shells for hook tests, and X for the X11 collector
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish xvfb openbox x11-utils
      # The X11 collector's live tests need a display and an EWMH window
      # manager. Wait until openbox advertises itself on the root window.
      - name: Start Xvfb and openbox
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          for _ in $(seq 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          for _ in $(seq 50); do DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id' && break; sleep 0.2; done
          DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'
          echo DISPLAY=:99 >> "$GITHUB_ENV"
      # CI has no terminal, but developers run the tests from one. On Linux
      # the race run happens under a pseudo-terminal, so a test that grabs
      # /dev/tty (as an interactive zsh does) fails here instead of hanging
      # on a laptop. macOS runs the suite without a terminal, then the
      # packages that start a shell again under one.
      - name: Test (race, under a terminal)
        if: runner.os == 'Linux'
        run: script -qec "go test -race -count=1 -timeout=10m ./..." /dev/null </dev/null
      - name: Test (race)
        if: runner.os == 'macOS'
        run: go test -race -count=1 ./...
      - name: Test shell-launching packages (under a terminal)
        if: runner.os == 'macOS'
        # Python's pty works the same on every platform and returns the
        # child's exit status, unlike BSD script(1).
        run: >-
          python3 -c 'import os, pty, sys; sys.exit(os.waitstatus_to_exitcode(pty.spawn(sys.argv[1:])))'
          go test -count=1 -timeout=3m ./cmd/burnout/ ./internal/adapters/integrations/shell/ </dev/null
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build
        run: go build -o bin/ ./cmd/...

  # The release pipeline and installers (packaging/README.md). The
  # installers' verifiers run against fixtures on every OS: macOS covers the
  # system LibreSSL, Windows both PowerShell 5.1 (.NET Framework) and 7.
  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -x packaging/*.sh packaging/*/*.sh
      - name: Test install.sh verifiers
        if: runner.os != 'Windows'
        run: sh packaging/test-install.sh
      - name: Test install.ps1 verifiers (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packaging/test-install.ps1
      - name: Test install.ps1 verifiers (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test-install.ps1
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
      - name: goreleaser check
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: check
      - name: goreleaser snapshot build
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=sign,sbom

  fuzz:
    runs-on: ubuntu-latest
    # Go before 1.27 can fail a fuzz run that ends at -fuzztime with
    # "context deadline exceeded" (go.dev/issue/75804), so fuzz on a
    # release with the fix. go.mod's minimum stays as it is.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: Fuzz wire decoder
        run: go test ./internal/wire/ -run='^$' -fuzz=FuzzDecode -fuzztime=60s
      - name: Fuzz Claude Code payload parser
        run: go test ./internal/adapters/integrations/claude/ -run='^$' -fuzz=FuzzParsePayload -fuzztime=60s
      - name: Fuzz config loader
        run: go test ./internal/config/ -run='^$' -fuzz=FuzzParse -fuzztime=60s
      - name: Fuzz ICS parser
        run: go test ./internal/domain/calendar/ -run='^$' -fuzz=FuzzParse -fuzztime=60s
      - name: Fuzz private-hours parser
        run: go test ./internal/domain/schedule/ -run='^$' -fuzz=FuzzParse -fuzztime=30s
      - name: Fuzz title redactor
        run: go test ./internal/domain/redact/ -run='^$' -fuzz=FuzzTitle -fuzztime=60s
